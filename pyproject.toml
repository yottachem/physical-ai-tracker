[project]
name = "physical-ai-tracker"
version = "0.1.0"
description = "Physical AI companies: status, funding and valuations, employment and size, and public announcements"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6",
    "pandas>=2.2",
    "pyarrow>=17",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
