# Source registry. Checked 2026-11-06.
sources:
  gdelt:
    name: GDELT DOC 2.0 article list
    url: https://api.gdeltproject.org/api/v2/doc/doc
    auth: none; at most 1 request per 5 seconds
    license: Free for any use with attribution; headlines and links only, no article text stored
    cadence: daily
  google_news:
    name: Google News RSS search
    url: https://news.google.com/rss/search
    auth: none
    license: Discovery only; the site links to the original publisher, never to Google
    cadence: daily
  newsroom:
    name: Company newsroom and IR feeds
    url: per company (companies.yaml newsroom_feed)
    auth: none
    license: Headlines and links only
    cadence: daily
  form_d:
    name: SEC EDGAR Form D (submissions + primary_doc.xml)
    url: https://data.sec.gov/submissions/
    auth: none; User-Agent with contact email; <= 10 requests/second
    license: Public domain (US Gov)
    cadence: daily
  job_boards:
    name: Greenhouse, Lever and Ashby public job-board APIs
    url: https://boards-api.greenhouse.io/v1/boards/{token}/jobs, https://api.lever.co/v0/postings/{token}, https://api.ashbyhq.com/posting-api/job-board/{token}
    auth: none
    license: Public postings; counts by function and location published, not posting text
    cadence: weekly
  warn:
    name: State WARN notices (CA, WA, TX, MA, PA)
    url: per state; to verify
    auth: none
    license: Public records
    cadence: weekly
  edgar:
    name: SEC EDGAR XBRL company facts and 10-K human capital
    url: https://data.sec.gov/api/xbrl/companyfacts/
    auth: none; User-Agent with contact email
    license: Public domain (US Gov)
    cadence: monthly
  prices:
    name: Month-end close (unofficial)
    url: https://query1.finance.yahoo.com/v8/finance/chart/
    auth: none
    license: Unofficial; publish derived market value only, never raw prices
    cadence: monthly
