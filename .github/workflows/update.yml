name: update
# Daily: SEC filings -> WARN notices (CA, TX) -> news -> acceptance rules -> (Mondays) job boards and public financials -> test -> commit data.
# Commits data/news/articles.csv, data/review/queue.csv, data/jobs/counts.csv, data/public/*.csv and auto-accepted
# ledger rows, so the site's history accumulates in git. Raw snapshots stay in the runner (gitignored).
# Scheduled runs need repo variable SCHEDULE_ON=true (on since 2026-11-07).
# Secret: CONTACT_EMAIL (SEC User-Agent; never written to the repo).
on:
  schedule:
    - cron: "30 11 * * *"   # daily 06:30 ET (EST)
  workflow_dispatch:
    inputs:
      jobs:
        description: "Also fetch job boards and public financials (otherwise Mondays only)"
        type: boolean
        default: false
      news_days:
        description: "News lookback in days"
        default: "3"

permissions:
  contents: write
  issues: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'schedule' || vars.SCHEDULE_ON == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: SEC filings
        run: uv run python -m ingest.filings --since "$(date -u -d '14 days ago' +%F)"
      - name: WARN notices
        run: uv run python -m ingest.warn
      - name: News
        run: uv run python -m ingest.news --sources bing,gnews,gdelt --days "${{ inputs.news_days || '3' }}"
      - name: Acceptance rules
        run: uv run python -m classify.accept
      - name: Job boards and public financials (Mondays, or when asked)
        run: |
          if [ "${{ inputs.jobs }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then
            uv run python -m ingest.jobs
            uv run python -m ingest.financials
          else
            echo "Not Monday; skipping job boards and financials"
          fi
      - name: Test
        run: uv run pytest -q
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/news data/review data/jobs data/public reference/ledger.csv
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Data update $(date -u +%F)"
          git pull --rebase   # main may have moved during the run (registry edits)
          git push
      - name: Open an issue if the run fails
        if: failure() && github.event_name == 'schedule'
        run: gh issue create -R "$GITHUB_REPOSITORY" --title "Update failed $(date -u +%F)" --body "See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
