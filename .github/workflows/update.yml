name: update
# Daily: SEC filings -> WARN notices (CA, TX, MA file) -> news -> acceptance rules -> (Mondays) job boards, public
# financials and prices -> test -> commit data.
# Commits data/news/articles.csv, data/review/queue.csv, data/jobs/counts.csv, data/public/*.csv and auto-accepted
# ledger rows, so the site's history accumulates in git. Raw snapshots stay in the runner (gitignored).
# Then: check statements -> build site -> deploy to GitHub Pages. A push to main skips ingest and rebuilds the site.
# Scheduled runs need repo variable SCHEDULE_ON=true (on since 2026-11-07); deploys need PAGES_LIVE=true.
# Secret: CONTACT_EMAIL (SEC User-Agent; never written to the repo).
on:
  schedule:
    - cron: "30 11 * * *"   # daily 06:30 ET (EST)
  workflow_dispatch:
    inputs:
      jobs:
        description: "Also fetch job boards, public financials and prices (otherwise Mondays only)"
        type: boolean
        default: false
      news_days:
        description: "News lookback in days"
        default: "3"
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'schedule' || vars.SCHEDULE_ON == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: SEC filings
        if: github.event_name != 'push'
        run: uv run python -m ingest.filings --since "$(date -u -d '14 days ago' +%F)"
      - name: WARN notices
        if: github.event_name != 'push'
        run: uv run python -m ingest.warn
      - name: News
        if: github.event_name != 'push'
        run: uv run python -m ingest.news --sources bing,gnews,gdelt,newsroom --days "${{ inputs.news_days || '3' }}"
      - name: Acceptance rules
        if: github.event_name != 'push'
        run: uv run python -m classify.accept
      - name: Job boards, public financials and prices (Mondays, or when asked)
        if: github.event_name != 'push'
        run: |
          if [ "${{ inputs.jobs }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then
            uv run python -m ingest.jobs
            uv run python -m ingest.financials
            uv run python -m ingest.prices
          else
            echo "Not Monday; skipping job boards, financials and prices"
          fi
      - name: Check statements
        run: uv run python -m analysis.claims
      - name: Test
        id: test
        run: uv run pytest -q
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/news data/review data/jobs data/public reference/ledger.csv
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Data update $(date -u +%F)"
          git pull --rebase   # main may have moved during the run (registry edits)
          git push
      - name: Build site
        if: always() && steps.test.outcome == 'success'
        run: uv run python site/build.py
      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.test.outcome == 'success'
        with:
          path: site/dist
      - name: Open an issue for statements under review
        if: always() && github.event_name == 'schedule' && hashFiles('analysis/results/review.json') != ''
        run: |
          uv run python -m analysis.claims --markdown > review.md
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "Statements under review in:title" --json number --jq length)
          if [ -s review.md ] && [ "$open" = "0" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "Statements under review $(date -u +%F)" --body-file review.md
          fi
      - name: Open an issue if the run fails
        if: failure() && github.event_name == 'schedule'
        run: gh issue create -R "$GITHUB_REPOSITORY" --title "Update failed $(date -u +%F)" --body "See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  deploy:
    needs: update
    if: vars.PAGES_LIVE == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
