# Company registry. Seeded 2026-11-06 from reference/seed/physical-ai-market-map-2026-11.md (Josh's Nov 2026 market map).
# ownership: private | public | subsidiary (own brand, owned by parent) | division (inside parent; parent-level data only)
# boston: Greater Boston as the map's Boston spotlight defines it (includes Beverly, Wilmington, Bedford, Billerica)
# boston_note: required when boston is true but the HQ is elsewhere; the site shows it next to the Boston tag
# hq_note: optional second site shown after the HQ on the company page (Genesis AI: US site)
# news.terms: exact phrases (any match); news.context: words one of which must also appear (ambiguous names)
# ticker: US symbol (needs cik), or SYMBOL.EXCHANGE for non-US listings (688836.SS); no SEC filings for those
# careers: {ats: greenhouse | lever | ashby | workable | workday | rippling | bamboohr | teamtailor | smartrecruiters,
#   token: board token} or {ats: other, token: careers page URL} (listed on the site, not counted); null = no public board
# wound_down: date operations ended (assets assigned or liquidated, company dissolved); needs a ledger status row on or
#   before it. Acquired companies are not wound down: they become subsidiaries or divisions of the buyer
# verify: fields not yet confirmed against a primary source; LAUNCH_GATE=1 pytest fails while any remain

