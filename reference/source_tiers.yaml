# Source tiers decide what is auto-accepted into reference/ledger.csv.
# tier1: auto-accept when the parse is clean and nothing in the ledger conflicts.
#   Primary sources (company domains from companies.yaml, wires, SEC, government, university) plus a major-outlet allowlist.
# tier2: reputable trade and regional press. Review queue.
# secondary: aggregators, AI-written trackers, company-profile sites, blogs. Review queue; shown as "secondary" on the site.
# A domain matches itself and its subdomains. Every source domain in the ledger must appear here or be a company domain
# (tests/test_reference.py), so new domains surface for a tier decision instead of defaulting silently.
# Checked 2026-11-06 against the 74 domains cited in the Nov 2026 market map.

tier1:
  wires: [businesswire.com, globenewswire.com, prnewswire.com, accesswire.com]
  filings: [sec.gov]
  government: [masstech.org, darpa.mil, arpa-h.gov, fda.gov, energy.gov]
  university: [cmu.edu, mit.edu]
  ir_hosting: [q4cdn.com]   # investor-relations document host (Ginkgo's Novo release)
  outlets: [reuters.com, bloomberg.com, wsj.com, ft.com, nytimes.com, apnews.com, cnbc.com, axios.com,
            theinformation.com, techcrunch.com, bostonglobe.com, therobotreport.com]

tier2: [3dprint.com, abc7news.com, biopharmatrend.com, biospace.com, bostonbizscene.com, breakbulk.news,
        business.mammothtimes.com, citybiz.co, digitalengineering247.com, electrek.co, exchange4media.com, geekwire.com,
        insidehpc.com, logisticsviewpoints.com, manufacturing.net, marketbeat.com, mediapost.com,
        medicaldevice-network.com, mmh.com, nasdaq.com, optics.org, pulse2.com, robotics247.com,
        roboticsandautomationnews.com, rutlandherald.com, sifted.eu, siliconangle.com, streetinsider.com,
        supplychain247.com, techradar.com, techspot.com, thenextweb.com, truckinginfo.com]

secondary: [ai2.work, aiwiki.ai, mean.ceo, boringbusinessnerd.com, complex.com, deep-tech-week.com, dev.to, dealroom.co,
